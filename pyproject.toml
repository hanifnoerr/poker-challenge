[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-challenge"
version = "0.1.0"
description = "Local heads-up poker bot competition prototype"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
py-modules = ["starter_bot"]

[tool.setuptools.package-data]
poker_challenge = ["static/*"]

[tool.setuptools.packages.find]
include = ["poker_challenge*"]
